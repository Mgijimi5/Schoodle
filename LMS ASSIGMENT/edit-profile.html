<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Edit Profile</h3>

</div>

<div class="card-body">

<div class="mb-3">

<label>Name</label>

<input type="text" id="name" class="form-control">

</div>

<div class="mb-3">

<label>Email</label>

<input type="email" id="email" class="form-control">

</div>

<div class="mb-3">

<label>Student Number</label>

<input type="text" id="student" class="form-control">

</div>

<div class="mb-3">

<label>Programme</label>

<input type="text" id="programme" class="form-control">

</div>

<div class="mb-3">

<label>Year of Study</label>

<input type="text" id="year" class="form-control">

</div>

<div class="mb-3">

<label>Institution</label>

<input type="text" id="institution" class="form-control">

</div>

<button onclick="saveProfile()" class="btn btn-success">

Save Changes

</button>

<a href="profile.html" class="btn btn-secondary">

Cancel

</a>

</div>

</div>

</div>

<script>

document.getElementById("name").value =
localStorage.getItem("name") || "";

document.getElementById("email").value =
localStorage.getItem("email") || "";

document.getElementById("student").value =
localStorage.getItem("student") || "";

document.getElementById("programme").value =
localStorage.getItem("programme") || "";

document.getElementById("year").value =
localStorage.getItem("year") || "";

document.getElementById("institution").value =
localStorage.getItem("institution") || "";

function saveProfile(){

localStorage.setItem("name",
document.getElementById("name").value);

localStorage.setItem("email",
document.getElementById("email").value);

localStorage.setItem("student",
document.getElementById("student").value);

localStorage.setItem("programme",
document.getElementById("programme").value);

localStorage.setItem("year",
document.getElementById("year").value);

localStorage.setItem("institution",
document.getElementById("institution").value);

alert("Profile Updated!");

window.location="profile.html";

}

</script>

</body>

</html>
